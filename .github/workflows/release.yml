
name: Android ARM64 Debug Build

on:
  workflow_dispatch:

  push:
    branches:
      - dev

permissions:
  contents: read

jobs:
  android:
    name: Build Android ARM64 Debug APK
    runs-on: ubuntu-latest

    steps:
      # 1. 获取源码
      - name: Checkout source code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      # 2. 加载项目构建版本
      - uses: ./.github/actions/load-build-versions

      # 3. 配置 Android NDK
      - uses: ./.github/actions/setup-ndk

      # 4. 配置 JDK
      - uses: ./.github/actions/setup-jbr

      # 5. Gradle 缓存
      - uses: ./.github/actions/gradle-cache
        with:
          read-only: 'true'
          build-cache-name: debug-android

      # 6. 配置 Go
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      # 7. Go Android 缓存
      - uses: ./.github/actions/go-android-cache
        with:
          read-only: 'true'

      # 8. 缓存资源文件
      - name: Cache route assets
        id: cache-assets
        uses: actions/cache@v6
        with:
          path: composeApp/src/commonMain/composeResources/files/sing-box
          key: assets-v2-${{ env.GEOIP_VERSION }}-${{ env.GEOSITE_VERSION }}-${{ hashFiles('buildScript/lib/assets.sh', 'libcore/cmd/internal/ruleset_generate/**', 'libcore/go.mod', 'libcore/go.sum') }}

      # 9. 准备资源
      - name: Prepare assets
        if: steps.cache-assets.outputs.cache-hit != 'true'
        run: make assets

      # 10. 构建 Android Go 核心
      - name: Build Android libcore
        run: make libcore_android

      # 11. 下载 Go 依赖
      - name: Download Go modules
        run: cd libcore && go mod download

      # 12. 生成库信息
      - name: Generate library metadata
        run: make aboutlibraries_go aboutlibraries_android

      # 13. 编译 Android ARM64 Debug APK
      - name: Build Android Debug APK
        run: ./gradlew :androidApp:assembleFossDebug

      # 14. 上传 APK
      - name: Upload Android APK
        uses: actions/upload-artifact@v7
        with:
          name: husi-android-arm64-debug
          path: androidApp/build/outputs/apk/foss/debug/*.apk
          if-no-files-found: error
          retention-days: 7
